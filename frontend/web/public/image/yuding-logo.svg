    <g transform="translate(125 10) rotate(-38 20 28)">
      <path d="M20 4C22 4 24 6 24 9V20L43 30C46 32 45 36 42 35L24 30V45L31 52V56L20 52L9 56V52L16 45V30L-2 35C-5 36-6 32-3 30L16 20V9C16 6 18 4 20 4Z" fill="url(#gold)"/>
      <path d="M20 9V47" fill="none" stroke="url(#cream)" stroke-width="1.5" stroke-linecap="round" opacity="0.78"/>
    </g>
  </g>

  <rect x="190" y="28" width="2" height="100" rx="1" fill="#D0A05C"/>
  <text x="220" y="102" fill="#123B35" font-family="Segoe UI Light, Segoe UI, Avenir Next, Avenir, Montserrat, Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="300" letter-spacing="9" textLength="326" lengthAdjust="spacingAndGlyphs">YUDING</text>
