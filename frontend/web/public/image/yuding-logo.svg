<svg xmlns="http://www.w3.org/2000/svg" width="600" height="156" viewBox="0 0 600 156" role="img" aria-labelledby="title desc" focusable="false">
  <title id="title">Yuding</title>
  <desc id="desc">Yuding travel logo with a clean aircraft, route swoosh and transparent background.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D9A8"/>
      <stop offset="0.52" stop-color="#D7A25D"/>
      <stop offset="1" stop-color="#B9793A"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B4D42"/>
      <stop offset="1" stop-color="#167867"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5DF"/>
      <stop offset="1" stop-color="#E9C58C"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 8)" aria-hidden="true">
    <!-- One gold route, with a restrained green wing accent kept separate. -->
