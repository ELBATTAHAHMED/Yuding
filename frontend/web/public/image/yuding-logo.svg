    <path d="M19 117C50 110 81 97 108 77C125 65 139 51 151 37" fill="none" stroke="#FFF0D2" stroke-width="1.7" stroke-linecap="round" opacity="0.82"/>
    <path d="M25 48C45 50 61 55 75 62C83 66 90 71 96 76C84 70 71 65 57 61C43 57 32 52 25 48Z" fill="url(#emerald)"/>
    <circle cx="15" cy="117" r="3.2" fill="#D7A25D"/>

