<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <link rel="stylesheet" href="loginN-style.css">
    <script src="popup-system.js"></script>
    <title>Login Admin - Yuding</title>
</head>
<body>
<!-- Logo positionné en haut à gauche -->
<div class="logo-top">
    <img src="image/logo1.png" alt="Yuding Logo - Admin Panel" id="headerLogo">
</div>

<!-- Bouton Dark Mode -->
<button id="darkModeToggle" class="dark-mode-toggle" title="Basculer le mode sombre">
    <i class="fas fa-moon" id="darkModeIcon"></i>
</button>
<div class="container">
    <input type="checkbox" id="flip">
    <div class="cover">
        <div class="front">
            <img src="image/img.png" alt="" id="coverImage">
            <div class="text">
                <span class="text-1">WELCOME TO<br> YUDDING</span>
                <span class="text-2">Let's get connected</span>
            </div>
        </div>
    </div>
    <div class="forms">
        <div class="form-content">
            <div class="login-form">
                <div class="title">Login</div>
                <form id="login-form">
                    <div class="input-boxes">
                        <div class="input-box">
                            <i class="fas fa-envelope"></i>
                            <input type="text" name="email" id="email" placeholder="Enter your email" required>
                        </div>
                        <div class="input-box">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" id="password" placeholder="Enter your password" required>
                        </div>
                        <div class="button input-box">
                            <input type="submit" value="Submit">
                        </div>
                        <p id="errorMessage" style="color: red; display: none;"></p>
                        <p id="welcomeMessage" style="color: green; display: none;"></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Popups modernes -->
<div id="popup-overlay" class="popup-overlay">
    <div class="popup-container">
        <div class="popup-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="popup-content">
            <h3 class="popup-title">Succès</h3>
            <p class="popup-message">Message par défaut</p>
        </div>
        <div class="popup-actions">
            <button class="popup-btn popup-btn-primary" id="popup-confirm">Confirmer</button>
            <button class="popup-btn popup-btn-secondary" id="popup-cancel">Annuler</button>
        </div>
        <button class="popup-close" id="popup-close">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        $('#login-form').submit(function(event) {
            event.preventDefault();
            var email = $('#email').val();
            var password = $('#password').val();

            $.ajax({
                url: 'http://localhost:8888/apiu/admin/search',
                type: 'POST',
                contentType: 'application/x-www-form-urlencoded',
                data: { email: email, password: password },
                success: function(response) {
                    localStorage.setItem('adminUser', JSON.stringify(response));
                    if (!localStorage.getItem('theme')) {
                        localStorage.setItem('theme', 'dark');
                    }
                    showToast('success', 'Connexion réussie ! Bienvenue ' + response.nom + ' ' + response.prenom, 3000);
                    $('#welcomeMessage').text('Bienvenue, ' + response.nom + ' ' + response.prenom).show();
                    
                    setTimeout(function() {
                        window.location.href = 'dashOverview.html';
                    }, 2500);
                },
                error: function(xhr, status, error) {
                    showErrorPopup('Erreur de connexion', 'Email ou mot de passe incorrect. Veuillez réessayer.');
                    $('#errorMessage').text('Email ou mot de passe incorrect').show();
                }
            });
        });
    });

    // ==================== POPUP MODERNE FUNCTIONALITY ====================
    function showPopup(type, title, message, onConfirm, onCancel) {
        const overlay = $('#popup-overlay');
        const popup = $('.popup-container');
        const icon = $('.popup-icon i');
        const titleEl = $('.popup-title');
        const messageEl = $('.popup-message');
        const confirmBtn = $('#popup-confirm');
        const cancelBtn = $('#popup-cancel');
        const closeBtn = $('#popup-close');
        
        // Réinitialiser les classes
        popup.removeClass('popup-success popup-error popup-warning popup-info');
        
        // Configurer selon le type
        switch(type) {
            case 'success':
                popup.addClass('popup-success');
                icon.removeClass().addClass('fas fa-check-circle');
                confirmBtn.text('Accéder au dashboard');
                cancelBtn.show();
                break;
            case 'error':
                popup.addClass('popup-error');
                icon.removeClass().addClass('fas fa-times-circle');
                confirmBtn.text('Réessayer');
                cancelBtn.hide();
                break;
            case 'warning':
                popup.addClass('popup-warning');
                icon.removeClass().addClass('fas fa-exclamation-triangle');
                confirmBtn.text('Continuer');
                cancelBtn.show();
                break;
            case 'info':
                popup.addClass('popup-info');
                icon.removeClass().addClass('fas fa-info-circle');
                confirmBtn.text('OK');
                cancelBtn.hide();
                break;
        }
        
        // Définir le contenu
        titleEl.text(title);
        messageEl.text(message);
        
        // Afficher le popup avec animation
        overlay.removeClass('popup-hide').addClass('popup-show');
        
        // Gestionnaires d'événements
        confirmBtn.off('click').on('click', function() {
            hidePopup();
            if (onConfirm) onConfirm();
        });
        
        cancelBtn.off('click').on('click', function() {
            hidePopup();
            if (onCancel) onCancel();
        });
        
        closeBtn.off('click').on('click', function() {
            hidePopup();
            if (onCancel) onCancel();
        });
        
        // Fermer en cliquant sur l'overlay
        overlay.off('click').on('click', function(e) {
            if (e.target === overlay[0]) {
                hidePopup();
                if (onCancel) onCancel();
            }
        });
        
        // Fermer avec Escape
        $(document).off('keyup.popup').on('keyup.popup', function(e) {
            if (e.keyCode === 27) {
                hidePopup();
                if (onCancel) onCancel();
            }
        });
    }
    
    function hidePopup() {
        const overlay = $('#popup-overlay');
        overlay.removeClass('popup-show').addClass('popup-hide');
        
        setTimeout(() => {
            overlay.removeClass('popup-hide');
        }, 300);
        
        $(document).off('keyup.popup');
    }

    function setHeaderLogo(isDark) {
        const logo = document.getElementById('headerLogo');
        if (!logo) {
            return;
        }
        logo.src = isDark ? 'image/logo1.png' : 'image/logodark.png';
    }

    function setCoverImage(isDark) {
        const coverImage = document.getElementById('coverImage');
        if (!coverImage) {
            return;
        }
        coverImage.src = isDark ? 'image/img1.png' : 'image/img.png';
    }

    // ==================== DARK MODE FUNCTIONALITY ====================
    function initDarkMode() {
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkModeIcon = document.getElementById('darkModeIcon');
        const body = document.body;
        
        // Vérifier le thème sauvegardé ou utiliser la préférence système
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
        
        // Appliquer le thème initial
        if (isDark) {
            body.setAttribute('data-theme', 'dark');
            darkModeIcon.className = 'fas fa-sun';
            darkModeToggle.classList.add('active');
        } else {
            body.setAttribute('data-theme', 'light');
            darkModeIcon.className = 'fas fa-moon';
            darkModeToggle.classList.remove('active');
        }
        setHeaderLogo(isDark);
        setCoverImage(isDark);
        
        // Gérer le clic sur le bouton
        darkModeToggle.addEventListener('click', function() {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            // Appliquer le nouveau thème
            body.setAttribute('data-theme', newTheme);
            
            // Sauvegarder la préférence
            localStorage.setItem('theme', newTheme);
            
            // Mettre à jour l'icône avec animation
            if (newTheme === 'dark') {
                darkModeIcon.className = 'fas fa-sun';
                darkModeToggle.classList.add('active');
            } else {
                darkModeIcon.className = 'fas fa-moon';
                darkModeToggle.classList.remove('active');
            }

            setHeaderLogo(newTheme === 'dark');
            setCoverImage(newTheme === 'dark');
            
            // Animation de transition
            body.style.transition = 'all 0.3s ease';
            setTimeout(() => {
                body.style.transition = '';
            }, 300);
        });
        
        // Écouter les changements de préférence système
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (!localStorage.getItem('theme')) {
                const newTheme = e.matches ? 'dark' : 'light';
                body.setAttribute('data-theme', newTheme);
                
                if (newTheme === 'dark') {
                    darkModeIcon.className = 'fas fa-sun';
                    darkModeToggle.classList.add('active');
                } else {
                    darkModeIcon.className = 'fas fa-moon';
                    darkModeToggle.classList.remove('active');
                }
                setHeaderLogo(newTheme === 'dark');
                setCoverImage(newTheme === 'dark');
            }
        });
    }
    
    // Initialiser le dark mode au chargement
    document.addEventListener('DOMContentLoaded', initDarkMode);
</script>
</body>
</html>
