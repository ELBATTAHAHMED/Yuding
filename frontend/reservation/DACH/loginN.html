<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <title>Login</title>
    <style>

        /* Réinitialisation */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #01796F;
            padding: 30px;
        }

        .container {
            position: relative;
            max-width: 850px;
            width: 100%;
            background: #fff;
            padding: 40px 30px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            perspective: 2700px;
            border-radius: 15px; /* Bordure arrondie pour le container */
            overflow: hidden;  /* Pour éviter que les éléments absolus ne débordent */
        }

        /* Logo en haut à gauche */
        .logo-top {
            position: absolute;
            top: 10px;
            width: 200px;
            left: 10px;
            z-index: 100;
        }
        .logo-top img {
            max-width: 150px;
            height: auto;
            border-radius: 10px; /* Optionnel : arrondir légèrement le logo */
        }

        .container .cover {
            position: absolute;
            top: 0;
            left: 50%;
            height: 100%;
            width: 50%;
            z-index: 98;
            transition: all 1s ease;
            transform-origin: left;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }
        .container #flip:checked ~ .cover {
            transform: rotateY(-180deg);
        }
        .container #flip:checked ~ .forms .login-form {
            pointer-events: none;
        }
        .container .cover .front,
        .container .cover .back {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
        }
        .cover .back {
            transform: rotateY(180deg);
        }
        .container .cover img {
            position: absolute;
            height: 100%;
            width: 100%;
            object-fit: cover;
            z-index: 10;
        }
        .container .cover .text {
            position: absolute;
            z-index: 10;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container .cover .text::before {
            content: '';
            position: absolute;
            height: 100%;
            width: 100%;
            opacity: 0.5;
            background: #01796F;
        }
        .cover .text .text-1,
        .cover .text .text-2 {
            z-index: 20;
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            text-align: center;
        }
        .cover .text .text-2 {
            font-size: 15px;
            font-weight: 500;
        }

        .container .forms {
            height: 100%;
            width: 100%;
            background: #fff;
        }
        .container .form-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .form-content .login-form,
        .form-content .signup-form {
            width: calc(100% / 2 - 25px);
        }
        .forms .form-content .title {
            position: relative;
            font-size: 24px;
            font-weight: 500;
            color: #333;
        }
        .forms .form-content .title:before {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            height: 3px;
            width: 25px;
            background: #01796F;
        }
        .forms .signup-form .title:before {
            width: 20px;
        }
        .forms .form-content .input-boxes {
            margin-top: 30px;
        }
        .forms .form-content .input-box {
            display: flex;
            align-items: center;
            height: 50px;
            width: 100%;
            margin: 10px 0;
            position: relative;
        }
        .form-content .input-box input {
            height: 100%;
            width: 100%;
            outline: none;
            border: none;
            padding: 0 30px;
            font-size: 16px;
            font-weight: 500;
            border-bottom: 2px solid rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .form-content .input-box input:focus,
        .form-content .input-box input:valid {
            background: #01796F;
        }
        .form-content .input-box i {
            position: absolute;
            color: #01796F;
            font-size: 17px;
        }
        .forms .form-content .text {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        .forms .form-content .text a {
            text-decoration: none;
        }
        .forms .form-content .text a:hover {
            text-decoration: underline;
        }
        .forms .form-content .button {
            color: #fff;
            margin-top: 40px;
        }
        .forms .form-content .button input {
            color: #fff;
            background: #01796F;
            border-radius: 6px;
            padding: 0;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .forms .form-content .button input:hover {
            background: #01796F;
        }
        .forms .form-content label {
            color: #01796F;
            cursor: pointer;
        }
        .forms .form-content label:hover {
            text-decoration: underline;
        }
        .forms .form-content .login-text,
        .forms .form-content .sign-up-text {
            text-align: center;
            margin-top: 25px;
        }
        .container #flip {
            display: none;
        }
        @media (max-width: 730px) {
            .container .cover {
                display: none;
            }
            .form-content .login-form,
            .form-content .signup-form {
                width: 100%;
            }
            .form-content .signup-form {
                display: none;
            }
            .container #flip:checked ~ .forms .signup-form {
                display: block;
            }
            .container #flip:checked ~ .forms .login-form {
                display: none;
            }
        }
    </style>
</head>
<body>
<!-- Logo positionné en haut à gauche -->
<div class="logo-top">
    <img src="image/logo1.png" alt="Logo">
</div>
<div class="container">
    <input type="checkbox" id="flip">
    <div class="cover">
        <div class="front">
            <img src="image/img.png" alt="">
            <div class="text">
                <span class="text-1">WELCOME TO<br> YUDDING</span>
                <span class="text-2">Let's get connected</span>
            </div>
        </div>
    </div>
    <div class="forms">
        <div class="form-content">
            <div class="login-form">
                <div class="title">Login</div>
                <form id="login-form">
                    <div class="input-boxes">
                        <div class="input-box">
                            <i class="fas fa-envelope"></i>
                            <input type="text" name="email" id="email" placeholder="Enter your email" required>
                        </div>
                        <div class="input-box">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" id="password" placeholder="Enter your password" required>
                        </div>
                        <div class="button input-box">
                            <input type="submit" value="Submit">
                        </div>
                        <p id="errorMessage" style="color: red; display: none;"></p>
                        <p id="welcomeMessage" style="color: green; display: none;"></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        $('#login-form').submit(function(event) {
            event.preventDefault();
            var email = $('#email').val();
            var password = $('#password').val();

            $.ajax({
                url: 'http://localhost:8888/apiu/admin/search',
                type: 'POST',
                contentType: 'application/x-www-form-urlencoded',
                data: { email: email, password: password },
                success: function(response) {
                    if (confirm("Bienvenue " + response.nom + " " + response.prenom + ". Voulez-vous accéder au tableau de bord ?")) {
                        $('#welcomeMessage').text('Bienvenue, ' + response.nom + ' ' + response.prenom).show();
                        setTimeout(function() {
                            window.location.href = 'dashActivitee.html';
                        }, 2000);
                    }
                },
                error: function(xhr, status, error) {
                    $('#errorMessage').text('Email ou mot de passe incorrect').show();
                }
            });
        });
    });
</script>
</body>
</html>
