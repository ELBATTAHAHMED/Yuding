            <script>
                const BASE_URL = 'http://localhost:8888'
                $(document).ready(function () {
                    $('#searchActivitiesForm').submit(function (event) {
                        event.preventDefault();
                        var pays = $('#pays').val();
                        var ville = $('#ville').val();

                        $.ajax({
                            url: `${BASE_URL}/apir/activities/search1`,
                            type: 'POST',
                            data: { ville: ville, pays: pays },
                            success: function (data) {
                                console.log(data);
                                var html = '';
                                if (data.length > 0) {
                                    data.forEach(function (activitee) {
                                        html += '<div class="hebergement-result">';
                                        html += '<strong>Ville: </strong><span>' + activitee.ville + '</span><br>';
                                        html += '<strong>Description: </strong><span>' + activitee.desc_activitee + '</span><br>';
                                        html += '<strong>Durée: </strong><span>' + activitee.duree +'jours'+ '</span><br>';
                                        html += '<strong>Pays: </strong><span>' + activitee.pays + '</span><br>';
                                        html += '<strong>Prix: </strong><span>' + activitee.prix_activitee + '$' + '</span><br>';
                                        html += '<strong>Responsable: </strong><span>' + activitee.nom_fournisseur +'</span><br>';
                                        html += '<strong>Tele: </strong><span>' + activitee.tele_fournisseur  + '</span><br>';
                                        //html += '<img src="' + activitee.photo + '" style="width:100px;height:100px;"><br>';
                                        var isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
                                        if (isLoggedIn) {
                                            html += '<button class="btn-booking" style="background-color:#218a87" onclick="window.location.href=\'reservationTransport.html?activiteeId=' + activitee.ida + '&userId=\' + sessionStorage.getItem(\'userId\')">Réserver</button>';
                                        } else {
                                            html += '<button class="btn-booking" style="background-color:#218a87" onclick="sessionStorage.setItem(\'postLoginRedirect\', \'reservationTransport.html?activiteeId=' + activitee.ida + '\'); showLoginRequiredPopup();">Réserver</button>';
                                        }
                                        html += '</div>';
                                    });
                                } else {
                                    html = '<div class="no-results-container">';
                                    html += '  <div class="no-results-icon"><i class="fas fa-search"></i></div>';
                                    html += '  <h3 class="no-results-title">Aucune activité trouvée</h3>';
                                    html += '  <p class="no-results-text">Essayez de modifier vos critères de recherche pour découvrir de nouvelles activités.</p>';
                                    html += '</div>';
                                }
                                $('#results-container').html(html);
                            },
                            error: function () {
                                $('#results-container').html('<div class="no-results-container"><div class="no-results-icon"><i class="fas fa-exclamation-triangle"></i></div><h3 class="no-results-title">Erreur de recherche</h3><p class="no-results-text">Une erreur est survenue lors de la recherche. Veuillez réessayer plus tard.</p></div>');
                            }
                        });
                    });
                });
            </script>
            <script>
                var conversationHistory = [];

                function toggleChatbot() {
                    const chatbotContainer = document.getElementById("chatbotContainer");
                    chatbotContainer.classList.toggle("show");
                }

                function sendMessage() {
                    const userInputElement = document.getElementById("userInput");
                    const userInput = userInputElement.value.trim();
                    if (!userInput) return;

                    const chatbotBody = document.getElementById("chatbotBody");

                    // 1) Afficher message utilisateur
                    showUserMessage(chatbotBody, userInput);

                    // 2) Mettre à jour l'historique
                    conversationHistory.push("User: " + userInput);

                    // 3) Construire le prompt

                    // 4) Vider le champ
                    userInputElement.value = '';

                    // 5) Afficher l'indicateur "assistant réfléchit"
                    const thinkingMessageDiv = showAssistantThinking(chatbotBody);

                    // 6) Appeler votre backend
                    $.get(`http://localhost:8888/ai/${encodeURIComponent(userInput)}`, function (data) {
                        // Supprimer l'indicateur
                        thinkingMessageDiv.remove();

                        // Afficher la réponse finale
                        showAssistantMessage(chatbotBody, data);

                        // Ajouter la réponse de l'assistant dans l'historique
                        conversationHistory.push("Assistant: " + data);

                    }).fail(function (jqXHR, textStatus, errorThrown) {
                        thinkingMessageDiv.remove();
                        showAssistantMessage(chatbotBody, "Désolé, une erreur s'est produite. Veuillez réessayer.");
                    });
                }

                // ---------- Fonctions utilitaires ----------

                function showUserMessage(chatbotBody, userInput) {
                    const userMessageDiv = document.createElement("div");
                    userMessageDiv.classList.add("chat-message", "user");
                    userMessageDiv.innerHTML = `
            <div class="user-bubble">
                <span class="message-text">${userInput}</span>
            </div>
        `;
                    chatbotBody.appendChild(userMessageDiv);
                    chatbotBody.scrollTop = chatbotBody.scrollHeight;
                }

                function showAssistantThinking(chatbotBody) {
                    const thinkingMessageDiv = document.createElement("div");
                    thinkingMessageDiv.classList.add("chat-message", "assistant");
                    thinkingMessageDiv.id = "thinkingIndicator";

                    thinkingMessageDiv.innerHTML = `
            <div class="assistant-avatar-circle">
                <svg class="assistant-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
                    <path
                            d="M738.3 287.6H285.7c-59 0-106.8 47.8-106.8 106.8v303.1c0 59 47.8 106.8 106.8 106.8h81.5v111.1c0 .7.8 1.1 1.4.7l166.9-110.6 41.8-.8h117.4l43.6-.4c59 0 106.8-47.8 106.8-106.8V394.5c0-59-47.8-106.9-106.8-106.9zM351.7 448.2c0-29.5 23.9-53.5 53.5-53.5s53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5-53.5-23.9-53.5-53.5zm157.9 267.1c-67.8 0-123.8-47.5-132.3-109h264.6c-8.6 61.5-64.5 109-132.3 109zm110-213.7c-29.5 0-53.5-23.9-53.5-53.5s23.9-53.5 53.5-53.5 53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5zM867.2 644.5V453.1h26.5c19.4 0 35.1 15.7 35.1 35.1v121.1c0 19.4-15.7 35.1-35.1 35.1h-26.5zM95.2 609.4V488.2c0-19.4 15.7-35.1 35.1-35.1h26.5v191.3h-26.5c-19.4 0-35.1-15.7-35.1-35.1zM561.5 149.6c0 23.4-15.6 43.3-36.9 49.7v44.9h-30v-44.9c-21.4-6.5-36.9-26.3-36.9-49.7 0-28.6 23.3-51.9 51.9-51.9s51.9 23.3 51.9 51.9z"
                    />
                </svg>
            </div>
            <div class="assistant-bubble">
                <span class="dot-typing">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </span>
            </div>
        `;
                    chatbotBody.appendChild(thinkingMessageDiv);
                    chatbotBody.scrollTop = chatbotBody.scrollHeight;
                    return thinkingMessageDiv;
                }

                function showAssistantMessage(chatbotBody, text) {
                    const assistantMessageDiv = document.createElement("div");
                    assistantMessageDiv.classList.add("chat-message", "assistant");
                    assistantMessageDiv.innerHTML = `
            <div class="assistant-avatar-circle">
                <svg class="assistant-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
                    <path
                            d="M738.3 287.6H285.7c-59 0-106.8 47.8-106.8 106.8v303.1c0 59 47.8 106.8 106.8 106.8h81.5v111.1c0 .7.8 1.1 1.4.7l166.9-110.6 41.8-.8h117.4l43.6-.4c59 0 106.8-47.8 106.8-106.8V394.5c0-59-47.8-106.9-106.8-106.9zM351.7 448.2c0-29.5 23.9-53.5 53.5-53.5s53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5-53.5-23.9-53.5-53.5zm157.9 267.1c-67.8 0-123.8-47.5-132.3-109h264.6c-8.6 61.5-64.5 109-132.3 109zm110-213.7c-29.5 0-53.5-23.9-53.5-53.5s23.9-53.5 53.5-53.5 53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5zM867.2 644.5V453.1h26.5c19.4 0 35.1 15.7 35.1 35.1v121.1c0 19.4-15.7 35.1-35.1 35.1h-26.5zM95.2 609.4V488.2c0-19.4 15.7-35.1 35.1-35.1h26.5v191.3h-26.5c-19.4 0-35.1-15.7-35.1-35.1zM561.5 149.6c0 23.4-15.6 43.3-36.9 49.7v44.9h-30v-44.9c-21.4-6.5-36.9-26.3-36.9-49.7 0-28.6 23.3-51.9 51.9-51.9s51.9 23.3 51.9 51.9z"
                    />
                </svg>
            </div>
            <div class="assistant-bubble">
                <span class="message-text">${text}</span>
            </div>
        `;
                    chatbotBody.appendChild(assistantMessageDiv);
                    chatbotBody.scrollTop = chatbotBody.scrollHeight;
                }
            </script>

            <script>
                // Header scroll effect supprimé car header non-fixed

                // Smooth scrolling for navigation links
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.addEventListener('click', function(e) {
                        if (this.getAttribute('href').startsWith('#')) {
                            e.preventDefault();
                            const target = document.querySelector(this.getAttribute('href'));
                            if (target) {
                                target.scrollIntoView({
                                    behavior: 'smooth',
                                    block: 'start'
                                });
                            }
                        }
                    });
                });

                // Animation on scroll for results
                const observerOptions = {
                    threshold: 0.1,
                    rootMargin: '0px 0px -50px 0px'
                };

                const observer = new IntersectionObserver(function(entries) {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.style.opacity = '1';
                            entry.target.style.transform = 'translateY(0)';
                        }
                    });
                }, observerOptions);

                // Observer les éléments de résultats quand ils sont créés
                const originalAjaxSuccess = function(data) {
                    console.log(data);
                    var html = '';
                    if (data.length > 0) {
                        data.forEach(function (activitee) {
                            html += '<div class="accommodation-result-card">';
                            html += '  <div class="accommodation-card-header">';
                            html += '    <h3 class="accommodation-title">' + (activitee.nom_activitee || 'Activité') + '</h3>';
                            html += '    <div class="accommodation-price">' + (activitee.prix_activitee ?? '-') + '$<span class="price-period">/activité</span></div>';
                            html += '  </div>';
                            html += '  <div class="accommodation-card-body">';
                            html += '    <div class="accommodation-location">';
                            html += '      <div class="location-info">';
                            html += '        <i class="fas fa-map-marker-alt"></i>';
                            html += '        <span>' + (activitee.ville || 'Ville') + '</span>';
                            html += '      </div>';
                            html += '      <div class="accommodation-type">';
                            html += '        <i class="fas fa-globe"></i>';
                            html += '        <span>' + (activitee.pays || 'Pays') + '</span>';
                            html += '      </div>';
                            html += '    </div>';
                            html += '    <div class="accommodation-features">';
                            html += '      <div class="feature-item">';
                            html += '        <i class="fas fa-clock"></i>';
                            html += '        <span>' + (activitee.duree || 'Durée non spécifiée') + '</span>';
                            html += '      </div>';
                            html += '      <div class="feature-item">';
                            html += '        <i class="fas fa-calendar-alt"></i>';
                            html += '        <span>' + (activitee.date || 'Date flexible') + '</span>';
                            html += '      </div>';
                            html += '    </div>';
                            html += '    <div class="accommodation-description">';
                            html += '      <h4><i class="fas fa-info-circle"></i> Description</h4>';
                            html += '      <p class="description-text">' + (activitee.desc_activitee || '') + '</p>';
                            html += '      <button class="description-toggle" type="button">Voir plus...</button>';
                            html += '    </div>';
                            html += '    <div class="accommodation-contact">';
                            html += '      <div class="contact-item">';
                            html += '        <span class="contact-label"><i class="fas fa-user"></i> Responsable:</span>';
                            html += '        <span class="contact-value">' + (activitee.nom_fournisseur || 'Non spécifié') + '</span>';
                            html += '      </div>';
                            html += '      <div class="contact-item">';
                            html += '        <span class="contact-label"><i class="fas fa-phone"></i> Contact:</span>';
                            html += '        <span class="contact-value">' + (activitee.tele_fournisseur || 'Non spécifié') + '</span>';
                            html += '      </div>';
                            html += '    </div>';
                            html += '  </div>';
                            html += '  <div class="accommodation-card-footer">';
                            var isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
                            if (isLoggedIn) {
                                html += '<button class="accommodation-booking-btn" onclick="window.location.href=\'reservationTransport.html?activiteeId=' + activitee.ida + '&userId=\' + sessionStorage.getItem(\'userId\')"><i class="fas fa-calendar-check"></i> Réserver maintenant</button>';
                            } else {
                                html += '<button class="accommodation-booking-btn" onclick="sessionStorage.setItem(\'postLoginRedirect\', \'reservationTransport.html?activiteeId=' + activitee.ida + '\'); showLoginRequiredPopup();"><i class="fas fa-sign-in-alt"></i> Se connecter pour réserver</button>';
                            }
                            html += '  </div>';
                            html += '</div>';
                        });
                    } else {
                        html = '<div class="no-results-container">';
                        html += '  <div class="no-results-icon"><i class="fas fa-search"></i></div>';
                        html += '  <h3 class="no-results-title">Aucune activité trouvée</h3>';
                        html += '  <p class="no-results-text">Essayez de modifier vos critères de recherche pour découvrir de nouvelles activités.</p>';
                        html += '</div>';
                    }
                    $('#results-container').html(html);

                    document.querySelectorAll('.description-toggle').forEach((button) => {
                        button.addEventListener('click', () => {
                            const container = button.closest('.accommodation-description');
                            container.classList.toggle('expanded');
                            button.textContent = container.classList.contains('expanded') ? 'Voir moins' : 'Voir plus...';
                        });
                    });
                    
                    // Animer les nouveaux éléments
                    setTimeout(() => {
                        document.querySelectorAll('.accommodation-result-card').forEach((el, index) => {
                            setTimeout(() => {
                                el.style.opacity = '1';
                                el.style.transform = 'translateY(0)';
                            }, index * 100);
                        });
                    }, 100);
                };

                // Remplacer le success handler de l'AJAX
                $(document).ready(function () {
                    $('#searchActivitiesForm').off('submit').submit(function (event) {
                        event.preventDefault();
                        var pays = $('#pays').val();
                        var ville = $('#ville').val();

                        // Afficher un loader
                        $('#results-container').html('<div style="text-align: center; padding: 2rem;"><i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-color);"></i><p style="margin-top: 1rem; color: var(--gray-medium);">Recherche en cours...</p></div>');

                        $.ajax({
                            url: `${BASE_URL}/apir/activities/search1`,
                            type: 'POST',
                            data: { ville: ville, pays: pays },
                            success: originalAjaxSuccess,
                            error: function () {
                                $('#results-container').html('<div style="text-align: center; padding: 2rem; color: #dc3545;"><i class="fas fa-exclamation-triangle" style="font-size: 2rem;"></i><p style="margin-top: 1rem;">Erreur lors de la recherche. Veuillez réessayer plus tard.</p></div>');
                            }
                        });
                    });
                });
            </script>

            <!-- ==================== DARK MODE FUNCTIONALITY ==================== -->
            <script>
            function setHeaderLogo(isDark) {
                const logo = document.getElementById('headerLogo');
                if (!logo) {
                    return;
                }
                logo.src = isDark ? 'image/logo1.png' : 'image/logodark.png';
            }

            function initDarkMode() {
                const darkModeToggle = document.getElementById('darkModeToggle');
                const darkModeIcon = document.getElementById('darkModeIcon');
                const body = document.body;
                
                // Vérifier le thème sauvegardé ou utiliser la préférence système
                const savedTheme = localStorage.getItem('theme');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
                
                // Appliquer le thème initial
                if (isDark) {
                    body.setAttribute('data-theme', 'dark');
                    darkModeIcon.className = 'fas fa-sun';
                    darkModeToggle.classList.add('active');
                } else {
                    body.setAttribute('data-theme', 'light');
                    darkModeIcon.className = 'fas fa-moon';
                    darkModeToggle.classList.remove('active');
                }
                setHeaderLogo(isDark);
                
                // Gérer le clic sur le bouton
                darkModeToggle.addEventListener('click', function() {
                    const currentTheme = body.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    
                    // Appliquer le nouveau thème
                    body.setAttribute('data-theme', newTheme);
                    
                    // Sauvegarder la préférence
                    localStorage.setItem('theme', newTheme);
                    
                    // Mettre à jour l'icône avec animation
                    if (newTheme === 'dark') {
                        darkModeIcon.className = 'fas fa-sun';
                        darkModeToggle.classList.add('active');
                    } else {
                        darkModeIcon.className = 'fas fa-moon';
                        darkModeToggle.classList.remove('active');
                    }
                    setHeaderLogo(newTheme === 'dark');
                    
                    // Animation de transition
                    body.style.transition = 'all 0.3s ease';
                    setTimeout(() => {
                        body.style.transition = '';
                    }, 300);
                });
                
                // Écouter les changements de préférence système
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                    if (!localStorage.getItem('theme')) {
                        const newTheme = e.matches ? 'dark' : 'light';
                        body.setAttribute('data-theme', newTheme);
                        
                        if (newTheme === 'dark') {
                            darkModeIcon.className = 'fas fa-sun';
                            darkModeToggle.classList.add('active');
                        } else {
                            darkModeIcon.className = 'fas fa-moon';
                            darkModeToggle.classList.remove('active');
                        }
                        setHeaderLogo(newTheme === 'dark');
                    }
                });
            }

            // Initialiser le dark mode au chargement
            document.addEventListener('DOMContentLoaded', initDarkMode);
            
            // Fonction pour afficher popup de connexion requise
            function showLoginRequiredPopup() {
                showConfirmPopup(
                    'Connexion requise',
                    'Vous devez être connecté pour réserver une activité. Souhaitez-vous vous connecter maintenant ?',
                    function() { // onConfirm - aller à la page de connexion
                        window.location.href = 'login.html';
                    },
                    null, // onCancel
                    { confirmText: 'Se connecter', cancelText: 'Annuler' }
                );
            }
            </script>

</body>
