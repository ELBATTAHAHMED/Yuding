<!DOCTYPE html>
<!-- Basé sur le code original de CodingNepal, adapté au thème vert et avec le formulaire Signup complet -->
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Login & Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/loginStyle.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <script src="DACH/popup-system.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
</head>
<header class="header">
    <div class="header-top">
        <div class="container1">
            <a href="index.html" class="logo">
                <img src="image/logo1.png" alt="Yuding Logo" id="headerLogo">
            </a>
            
            <nav class="header-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i> Accueil
                </a>
                <a href="index.html#room" class="nav-item">
                    <i class="fas fa-bed"></i> Hébergements
                </a>
                <a href="index.html#gallery" class="nav-item">
                    <i class="fas fa-images"></i> Galerie
                </a>
            </nav>

            <!-- Bouton Dark Mode -->
            <button id="darkModeToggle" class="dark-mode-toggle" title="Basculer le mode sombre">
                <i class="fas fa-moon" id="darkModeIcon"></i>
            </button>

        </div>
    </div>
</header>
<body>

<section class="home" id="home">
    <video src="image/video1.mp4" autoplay muted loop class="video"></video>
</section>

<div class="container">
    <!-- Checkbox pour l'effet flip -->
    <input type="checkbox" id="flip" />

    <!-- Couverture (images + textes) -->
    <div class="cover">
        <div class="front">
            <img src="image/pic1.jpg" alt="Image Front" id="coverFrontImage">
            <div class="text">
                <span class="text-1">WELCOME TO<br> YUDDING</span>
                <span class="text-2">Let's get connected</span>
            </div>
        </div>
        <div class="back">
            <img class="backImg" src="image/img.png" alt="Image Back" id="coverBackImage">
            <div class="text">
                <span class="text-1">WELCOME TO<br>YUDDING</span>
                <span class="text-2">Signup Now</span>
            </div>
        </div>
    </div>

    <!-- Zone des formulaires -->
    <div class="forms">
        <div class="form-content">
            <!-- =========== LOGIN FORM =========== -->
            <div class="login-form">
                <div class="title">Login</div>
                <form id="login-form">
                    <div class="input-boxes">
                        <div class="input-box">
                            <i class="fas fa-user-circle"></i>
                            <input type="text" id="username" placeholder="Username" required>
                        </div>
                        <div class="input-box">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Enter your password" required>
                        </div>
                        <div class="button input-box">
                            <input type="submit" value="Submit" class="btn">
                        </div>
                        <div class="text sign-up-text">
                            Don't have an account?
                            <label for="flip">Signup now</label>
                        </div>
                    </div>
                </form>
            </div>
            <!-- =========== SIGNUP FORM (COMPLET) =========== -->
            <div class="signup-form">
                <div class="title">Signup</div>
                <form id="signup-form">
                    <div class="input-boxes">
                        <!-- Nom -->
                        <div class="input-box">
                            <i class="fas fa-user"></i>
                            <input type="text" name="nom_utilisateur" placeholder="Nom" required>
                        </div>
                        <!-- Prénom -->
                        <div class="input-box">
                            <i class="fas fa-user"></i>
                            <input type="text"  name="prenom_utilisateur" placeholder="Prénom" required>
                        </div>
                        <!-- Email -->
                        <div class="input-box">
                            <i class="fas fa-envelope"></i>
                            <input type="email" name="email_utilisateur" placeholder="Email" required>
                        </div>
                        <!-- Date de naissance -->
                        <div class="input-box">
                            <i class="fas fa-calendar"></i>
                            <input type="date" name="date_naissance"required>
                        </div>
                        <!-- Pays -->
                        <div class="input-box">
                            <i class="fas fa-flag"></i>
                            <input type="text" name="pays" placeholder="Pays" required>
                        </div>
                        <!-- Genre -->
                        <div class="input-box">
                            <i class="fas fa-venus-mars"></i>
                            <select name="genre" required>
                                <option value="">Sélectionnez votre genre</option>
                                <option value="Homme">Homme</option>
                                <option value="Femme">Femme</option>
                            </select>
                        </div>
                        <!-- Username -->
                        <div class="input-box">
                            <i class="fas fa-user-circle"></i>
                            <input type="text" name="username" placeholder="Username" required>
                        </div>
                        <!-- Password -->
                        <div class="input-box">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" placeholder="Password" required>
                        </div>
                        <!-- Téléphone -->
                        <div class="input-box">
                            <i class="fas fa-phone"></i>
                            <input type="tel" name="num_tele" placeholder="Téléphone" required>
                        </div>
                        <!-- Bouton Submit -->
                        <div class="button input-box">
                            <input type="submit" value="Submit">
                        </div>
                        <div class="text sign-up-text">
                            Already have an account?
                            <label for="flip">Login now</label>
                        </div>
                    </div>
                </form>
            </div>
            <!-- /signup-form -->
        </div><!-- /form-content -->
    </div><!-- /forms -->
</div><!-- /container -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
        $("#signup-form").submit(function (event) {
            event.preventDefault();
            var formData = $(this).serializeArray().reduce(function (obj, item) {
                obj[item.name] = item.value;
                return obj;
            }, {});

            $.ajax({
                url: "http://localhost:8888/apiu/utilisateurs/create",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(formData),
                success: function () {
                    // Utiliser un toast pour l'inscription réussie (plus fluide)
                    showToast('success', 'Inscription réussie ! Bienvenue sur YUDING !', 3000);
                    
                    // Basculer automatiquement vers le formulaire de connexion après un délai
                    setTimeout(() => {
                        document.getElementById('flip').checked = false;
                    }, 1500);
                },
                error: function (xhr) {
                    showErrorPopup('Échec de l\'inscription', 'Veuillez vérifier vos informations et réessayer.');
                },
            });
        });
    });
</script>
<script>
    $(document).ready(function () {
        $("#login-form").submit(function (event) {
            event.preventDefault();

            var username = $('#username').val();
            var password = $('#password').val();

            $.ajax({
                url: 'http://localhost:8888/apiu/utilisateurs/search',
                type: 'POST',
                data: {
                    username: username,
                    password: password
                },
                success: function(response) {
                    console.log("Réponse complète du serveur:", response);  // Affiche toute la réponse
                    if (response && response.idu) {
                        console.log("User ID:", response.idu);  // Affiche l'ID utilisateur
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('userId', response.idu);  // Sauvegarde l'ID dans sessionStorage
                        // Utiliser un toast pour la connexion réussie (plus fluide)
                        showToast('success', 'Connexion réussie ! Salut et bienvenue sur YUDING !', 2500);
                        
                        // Rediriger automatiquement après un délai court
                        setTimeout(() => {
                            const redirectUrl = sessionStorage.getItem('postLoginRedirect');
                            if (redirectUrl) {
                                sessionStorage.removeItem('postLoginRedirect');
                                window.location.href = redirectUrl;
                            } else {
                                window.location.href = 'index.html';
                            }
                        }, 2000);
                    } else {
                        showErrorPopup('Erreur de connexion', 'L\'ID de l\'utilisateur n\'a pas été renvoyé. Veuillez réessayer.');
                    }
                },
                error: function(xhr) {
                    showErrorPopup('Échec de la connexion', 'Veuillez vérifier votre nom d\'utilisateur et votre mot de passe et réessayer.');
                }
            });
        });
    });
</script>

<!-- ==================== DARK MODE FUNCTIONALITY ==================== -->
<script>
function setHeaderLogo(isDark) {
    const logo = document.getElementById('headerLogo');
    if (!logo) {
        return;
    }
    logo.src = isDark ? 'image/logo1.png' : 'image/logodark.png';
}

function setCoverImages(isDark) {
    const frontImage = document.getElementById('coverFrontImage');
    const backImage = document.getElementById('coverBackImage');

    if (frontImage) {
        frontImage.src = isDark ? 'image/pic2.jpg' : 'image/pic1.jpg';
    }
    if (backImage) {
        backImage.src = isDark ? 'image/img1.png' : 'image/img.png';
    }
}

function initDarkMode() {
    const darkModeToggle = document.getElementById('darkModeToggle');
    const darkModeIcon = document.getElementById('darkModeIcon');
    const body = document.body;
    
    // Vérifier le thème sauvegardé ou utiliser la préférence système
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
    
    // Appliquer le thème initial
    if (isDark) {
        body.setAttribute('data-theme', 'dark');
        darkModeIcon.className = 'fas fa-sun';
        darkModeToggle.classList.add('active');
    } else {
        body.setAttribute('data-theme', 'light');
        darkModeIcon.className = 'fas fa-moon';
        darkModeToggle.classList.remove('active');
    }
    setHeaderLogo(isDark);
    setCoverImages(isDark);
    
    // Gérer le clic sur le bouton
    darkModeToggle.addEventListener('click', function() {
        const currentTheme = body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        // Appliquer le nouveau thème
        body.setAttribute('data-theme', newTheme);
        
        // Sauvegarder la préférence
        localStorage.setItem('theme', newTheme);
        
        // Mettre à jour l'icône avec animation
        if (newTheme === 'dark') {
            darkModeIcon.className = 'fas fa-sun';
            darkModeToggle.classList.add('active');
        } else {
            darkModeIcon.className = 'fas fa-moon';
            darkModeToggle.classList.remove('active');
        }
        setHeaderLogo(newTheme === 'dark');
        setCoverImages(newTheme === 'dark');
        
        // Animation de transition
        body.style.transition = 'all 0.3s ease';
        setTimeout(() => {
            body.style.transition = '';
        }, 300);
    });
    
    // Écouter les changements de préférence système
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem('theme')) {
            const newTheme = e.matches ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            
            if (newTheme === 'dark') {
                darkModeIcon.className = 'fas fa-sun';
                darkModeToggle.classList.add('active');
            } else {
                darkModeIcon.className = 'fas fa-moon';
                darkModeToggle.classList.remove('active');
            }
            setHeaderLogo(newTheme === 'dark');
            setCoverImages(newTheme === 'dark');
        }
    });
}

// Initialiser le dark mode au chargement
document.addEventListener('DOMContentLoaded', initDarkMode);
</script>

</body>
</html>
