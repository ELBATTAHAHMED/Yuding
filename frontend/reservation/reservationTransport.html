<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - Yuding</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/reservationStyle.css">
    <script src="DACH/popup-system.js"></script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
            
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
<div class="wrapper">
    <!-- Conteneur du logo avec fond sombre pour garantir le contraste du logo blanc -->
    <div class="logo-container">
        <img src="image/logo1.png" alt="Logo" class="logo">
        <button id="darkModeToggle" class="dark-mode-toggle" title="Basculer le mode sombre" aria-label="Basculer le mode sombre">
            <i class="fas fa-moon" id="darkModeIcon"></i>
        </button>
    </div>

    <form id="reservationForm">
        <h1>Réservation</h1>
        <div class="input-box">
            <label for="date">
                <i class="fas fa-calendar-alt"></i>
                Date de début de réservation
            </label>
            <input type="date" id="date" name="date" required>
        </div>
        <div class="input-box">
            <label for="username">
                <i class="fas fa-user"></i>
                Nom d'utilisateur
            </label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="input-box">
            <label for="email">
                <i class="fas fa-envelope"></i>
                Email
            </label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="input-box">
            <label for="duree">
                <i class="fas fa-clock"></i>
                Durée de réservation (jours)
            </label>
            <input type="number" id="duree" name="duree" required min="1">
        </div>
        <div class="input-box">
            <label for="nombrepersonne">
                <i class="fas fa-users"></i>
                Nombre de personnes
            </label>
            <input type="number" id="nombrepersonne" name="nombrepersonne" required min="1">
        </div>
        <button type="submit" class="btn">Réserver</button>
    </form>

    <div class="payment-section" style="display: none;" id="payment-section">
        <h2>Paiement</h2>
        <p>Montant total à payer: <span id="montant-total"></span> €</p>
        <form id="paymentForm">
            <div class="input-box">
                <label for="mode_paiement">
                    <i class="fas fa-credit-card"></i>
                    Mode de paiement
                </label>
                <select id="mode_paiement" name="mode_paiement" required>
                    <option value="">Sélectionnez un mode de paiement</option>
                    <option value="carte_credit">💳 Carte de crédit</option>
                    <option value="carte_debit">💳 Carte de débit</option>
                    <option value="paypal">🅿️ PayPal</option>
                    <option value="apple_pay">🍎 Apple Pay</option>
                    <option value="google_pay">🌐 Google Pay</option>
                </select>
            </div>
            <div class="input-box">
                <label for="card-number">
                    <i class="fas fa-credit-card"></i>
                    Numéro de carte
                </label>
                <input type="text" id="card-number" name="card-number" required placeholder="1234 5678 9012 3456">
            </div>
            <div class="input-box">
                <label for="expiry-date">
                    <i class="fas fa-calendar"></i>
                    Date d'expiration
                </label>
                <input type="date" id="expiry-date" name="expiry-date" required>
            </div>
            <div class="input-box">
                <label for="cvv">
                    <i class="fas fa-lock"></i>
                    CVV
                </label>
                <input type="text" id="cvv" name="cvv" required placeholder="123" maxlength="4">
            </div>
            <button type="submit" class="btn" id="payment-btn">
                <i class="fas fa-check-circle"></i>
                Confirmer le paiement
            </button>
        </form>
    </div>

    <!-- Message de confirmation -->
    <div id="confirmation-message" style="display: none;">
        <i class="fas fa-check-circle" style="font-size: 3rem; color: #27ae60; margin-bottom: 1rem;"></i>
        <h2>Paiement réussi !</h2>
        <p>Merci pour votre réservation. Vous allez être redirigé vers la page de confirmation.</p>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function getUrlParameter(name) {
        name = name.replace(/[\[\]]/g, '\\$&');
        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
        var results = regex.exec(window.location.search);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }
    $(document).ready(function() {
        // Récupérer l'ID utilisateur depuis sessionStorage
        var userId = sessionStorage.getItem("userId");
        console.log("User ID in reservationTransport page:", userId);

        if (!userId) {
            showErrorPopup('Erreur de connexion', 'Vous devez être connecté pour faire une réservation.', function() {
                window.location.href = 'login.html';
            });
            return;
        }
        var idHebergement = getUrlParameter('hebergementId');
        console.log("ID Hébergement:", idHebergement);
        var idTransport = getUrlParameter('transportId');
        console.log("ID Transport:", idTransport);
        var idActivitee = getUrlParameter('activiteeId');
        console.log("ID Activitee:", idActivitee);

        // Récupération des informations utilisateur
        $.ajax({
            url: `http://localhost:8888/apiu/utilisateurs/id/` + userId,
            type: 'GET',
            success: function(user) {
                $('#username').val(user.username);
                $('#email').val(user.email_utilisateur);
            },
            error: function() {
                showErrorPopup('Erreur', 'Impossible de récupérer vos informations utilisateur. Veuillez vous reconnecter.');
            }
        });

        var reservationId;

        $('#reservationForm').submit(function(event) {
            event.preventDefault();

            var reservationData = {
                ...(idHebergement && { hebergement: { id_hebergement: idHebergement } }),
                ...(idTransport && { transport: { idt: idTransport } }),
                ...(idActivitee && { activitee: { ida: idActivitee } }),
                date: $('#date').val(),
                duree: $('#duree').val(),
                nombrepersonne: $('#nombrepersonne').val(),
                username: $('#username').val(),
                email: $('#email').val(),
            };

            // Calcul du prix total
            var prixUnitaire = 100;
            var prixTotal = reservationData.duree * reservationData.nombrepersonne * prixUnitaire;
            reservationData.prixtot = prixTotal.toFixed(2);

            showInfoPopup('Confirmation de réservation', 'Le prix total de la réservation est de ' + prixTotal.toFixed(2) + ' €. Cliquez sur Continuer pour procéder au paiement.', function() {
                // Continuer vers le paiement
            });

            // Afficher la section de paiement
            $('#montant-total').text(prixTotal.toFixed(2));
            $('#payment-section').show();
            $('#reservationForm').hide();

            // Enregistrer la réservation
            $.ajax({
                url: `http://localhost:8888/apir/reservations/create/` + userId,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(reservationData),
                success: function(response) {
                    reservationId = response.idr;
                    sessionStorage.setItem('currentReservationId', reservationId);
                    showSuccessPopup('Réservation réussie !', 'Votre réservation a été enregistrée avec succès. Procédez maintenant au paiement.');
                },
                error: function() {
                    showErrorPopup('Erreur de réservation', 'Impossible de créer votre réservation. Veuillez vérifier vos informations et réessayer.');
                }
            });
        });

        $('#paymentForm').submit(function(event) {
            event.preventDefault();

            const montantTotal = parseFloat($('#montant-total').text());
            reservationId = sessionStorage.getItem('currentReservationId');
            console.log("ID Reservation:", reservationId);
            console.log("Prix total:", montantTotal);
            var paymentData = {
                idr: reservationId,
                prixtot: montantTotal,
                modepaiement: $('#mode_paiement').val(),
                numcarte: $('#card-number').val(),
                date: $('#expiry-date').val(),
                cvv: $('#cvv').val(),
            };

            $.ajax({
                url: `http://localhost:8888/apir/paiements/create`,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(paymentData),
                success: function(response) {
                    // Utiliser un toast pour le paiement réussi (plus fluide)
                    showToast('success', 'Paiement réussi ! Merci pour votre réservation.', 3000);
                    
                    // Rediriger automatiquement vers la page de confirmation
                    setTimeout(() => {
                        window.location.href = 'confimation.html';
                    }, 2500);
                    $('#payment-section').hide();
                    $('#confirmation-message').show();
                    $('#reservationForm').show().trigger('reset');
                    window.location.href = 'confimation.html';
                },
                error: function() {
                    showErrorPopup('Erreur de paiement', 'Votre paiement n\'a pas pu être traité. Veuillez vérifier vos informations bancaires et réessayer.');
                }
            });
        });
    });

    // Dark Mode Functionality
    function initDarkMode() {
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkModeIcon = document.getElementById('darkModeIcon');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
        
        if (isDark) {
            html.setAttribute('data-theme', 'dark');
            darkModeIcon.className = 'fas fa-sun';
            darkModeToggle.classList.add('active');
        } else {
            html.removeAttribute('data-theme');
            darkModeIcon.className = 'fas fa-moon';
            darkModeToggle.classList.remove('active');
        }
        
        darkModeToggle.addEventListener('click', function() {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            if (newTheme === 'dark') {
                html.setAttribute('data-theme', 'dark');
                darkModeIcon.className = 'fas fa-sun';
                darkModeToggle.classList.add('active');
            } else {
                html.removeAttribute('data-theme');
                darkModeIcon.className = 'fas fa-moon';
                darkModeToggle.classList.remove('active');
            }
            
            localStorage.setItem('theme', newTheme);
            
            html.style.transition = 'all 0.3s ease';
            setTimeout(() => {
                html.style.transition = '';
            }, 300);
        });
        
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (!localStorage.getItem('theme')) {
                const newTheme = e.matches ? 'dark' : 'light';
                if (newTheme === 'dark') {
                    html.setAttribute('data-theme', 'dark');
                    darkModeIcon.className = 'fas fa-sun';
                    darkModeToggle.classList.add('active');
                } else {
                    html.removeAttribute('data-theme');
                    darkModeIcon.className = 'fas fa-moon';
                    darkModeToggle.classList.remove('active');
                }
            }
        });
    }

    // Initialize dark mode when DOM is loaded
    $(document).ready(function() {
        initDarkMode();
    });
</script>
</body>
</html>
