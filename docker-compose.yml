services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    container_name: pgvector-dock
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d mydatabase" ]
      interval: 5s
      timeout: 5s
      retries: 5
  mysql:
    image: mysql:8
    container_name: mysql-dock
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
  discovery-service:
    build: ./backend/discovery-service
    container_name: discovery-dock
    ports:
      - '8761:8761'
    expose:
      - '8761'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      retries: 4
  config-service:
    build: ./backend/config-service
    container_name: config-dock
    ports:
      - '9091:9091'
    expose:
      - '9091'
    volumes:
      - ./backend/config-repo:/config-repo
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:9091/actuator/health" ]
      interval: 10s
      retries: 4
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8761/eureka
    depends_on:
      discovery-service:
        condition: service_healthy
  user-service:
    build: ./backend/user-service
    container_name: user-dock
    ports:
      - '8081:8081'
    expose:
      - '8081'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8081/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 40s
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8761/eureka
      - CONFIG_SERVICE_URL=http://config-dock:9091
    depends_on:
      config-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
  commentaire-service:
    build: ./backend/commentaire-service
    container_name: commentaire-dock
    ports:
      - '8072:8072'
    expose:
      - '8072'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8072/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8761/eureka
      - CONFIG_SERVICE_URL=http://config-dock:9091
    depends_on:
      config-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
  ai-service:
    build: ./backend/ai-service
    container_name: ai-dock
    ports:
      - '7777:7777'
    expose:
      - '7777'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:7777/actuator/health" ]
      interval: 15s
      timeout: 20s
      retries: 8
      start_period: 120s
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8761/eureka
      - CONFIG_SERVICE_URL=http://config-dock:9091
    depends_on:
      pgvector:
        condition: service_healthy
      config-service:
        condition: service_healthy
  reservation-service:
    build: ./backend/reservation-service
    container_name: reservation-dock
    ports:
      - '8090:8090'
    expose:
      - '8090'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8090/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 40s
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8761/eureka
      - CONFIG_SERVICE_URL=http://config-dock:9091
    depends_on:
      config-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
  gateway-service:
    build: ./backend/gateway-service
    container_name: gateway-dock
    ports:
      - '8888:8888'
    expose:
      - '8888'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 60s
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8761/eureka
      - CONFIG_SERVICE_URL=http://config-dock:9091
    depends_on:
      reservation-service:
        condition: service_healthy
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-dock
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=
    depends_on:
      - mysql



volumes:
  mysql-data:

