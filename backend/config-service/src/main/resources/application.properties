spring.application.name=config-service
server.port=9091

# Spring Cloud Config Server: native repository is primary for tracked configuration files
spring.profiles.active=${CONFIG_SERVER_PROFILE:native}

# Native repository search locations: classpath fallback and relative workspace/container paths
spring.cloud.config.server.native.search-locations=${CONFIG_SEARCH_LOCATIONS:classpath:/config,file:./config,file:../config,file:../../config,file:/config}

# Git repository URI fallback when git profile is explicitly activated
spring.cloud.config.server.git.uri=${CONFIG_REPO_URI:file:///config-repo}

# Eureka Client Registration
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
