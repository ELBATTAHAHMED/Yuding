# ====================================================================
# Yuding V2 - Shared Staging Profile (application-staging.yml)
# Active when SPRING_PROFILES_ACTIVE=staging
# ====================================================================

spring:
  datasource:
    # Staging uses environment variables; container network standard port is 5432
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:yuding}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://discovery-service:8761/eureka}
    prefer-ip-address: true

# Staging CORS - configured via environment variable
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.yuding.travel}

# Cookie security - true for HTTPS staging environments
cookie:
  secure: true

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    com.ahmed: INFO

management:
  endpoint:
    health:
      show-details: when-authorized
