# ====================================================================
# Yuding V2 - Gateway Service Staging Profile (gateway-service-staging.yml)
# ====================================================================

spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:https://staging.yuding.travel}
            allowedMethods: GET,POST,PUT,DELETE,PATCH,OPTIONS
            allowedHeaders: Authorization,Content-Type,X-Request-Id,X-Correlation-Id,X-Requested-With,Accept,Origin
            exposedHeaders: X-Request-Id,X-Correlation-Id
            allowCredentials: true
            maxAge: 3600
