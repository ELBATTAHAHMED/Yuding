# ====================================================================
# Yuding V2 - Travel Service Base Configuration (travel-service.yml)
# ====================================================================

server:
  port: 8082
  max-http-request-header-size: 16KB

spring:
  application:
    name: travel-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yuding}?currentSchema=travel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: travel
    hibernate:
      ddl-auto: none
    show-sql: false

jwt:
  public-key-location: classpath:certs/public.pem

logging:
  level:
    root: INFO
    com.ahmed.travelservice: INFO

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:63342,http://127.0.0.1:5500}

travel:
  providers:
    flights: ${TRAVEL_FLIGHTS_PROVIDER:none}
    hotels: ${TRAVEL_HOTELS_PROVIDER:none}
    activities: ${TRAVEL_ACTIVITIES_PROVIDER:none}
    transfers: ${TRAVEL_TRANSFERS_PROVIDER:none}
    default-provider: none
  scrappa:
    api-key: ${SCRAPPA_API_KEY:}
    base-url: ${SCRAPPA_BASE_URL:https://scrappa.co/api}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
  nuitee:
    api-key: ${NUITEE_API_KEY:}
    base-url: ${NUITEE_BASE_URL:https://api.liteapi.travel/v3.0}
    connect-timeout-ms: 10000
    read-timeout-ms: 20000

