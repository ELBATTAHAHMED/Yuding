# ====================================================================
# Yuding V2 - Gateway Service Development Profile (gateway-service-dev.yml)
# ====================================================================

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:63342,http://127.0.0.1:5500}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: Authorization,Content-Type,X-Request-Id,X-Correlation-Id,X-Requested-With,Accept,Origin
            allowCredentials: true
            maxAge: 3600
