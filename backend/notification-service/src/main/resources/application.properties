spring.application.name=notification-service
server.port=8085

# Spring Cloud Config
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9091}
spring.cloud.config.fail-fast=false

# Eureka Discovery
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
spring.cloud.discovery.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JPA default schema fallback
spring.jpa.properties.hibernate.default_schema=notification
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Default datasource fallback if config server is unavailable
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yuding}?currentSchema=notification}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Default mail sender (Mailpit)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# App defaults
yuding.notification.from-address=${SMTP_FROM_ADDRESS:no-reply@yuding.local}
yuding.notification.from-name=${SMTP_FROM_NAME:Yuding}
yuding.notification.frontend-base-url=${YUDING_FRONTEND_BASE_URL:http://localhost:3000}
yuding.notification.max-attempts=${YUDING_NOTIFICATION_MAX_ATTEMPTS:5}
yuding.notification.stale-processing-timeout-minutes=5
yuding.notification.worker-enabled=true
yuding.notification.worker-fixed-delay-ms=2000
