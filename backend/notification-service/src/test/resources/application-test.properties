spring.application.name=notification-service
server.port=-1

# Eureka disabled in test
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Real PostgreSQL test datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yuding}?currentSchema=notification
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=notification
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Mailpit dev SMTP
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Yuding notification defaults
yuding.notification.active-provider=mock
yuding.notification.worker-enabled=false
yuding.notification.max-attempts=5
yuding.notification.stale-processing-timeout-minutes=5
yuding.notification.frontend-base-url=http://localhost:3000
