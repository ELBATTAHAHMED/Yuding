# Application name and port
spring.application.name=gateway-service
server.port=8888

# Configuration Eureka
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
spring.cloud.discovery.enabled=true

# Spring Cloud Config
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9091}
spring.cloud.config.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ================================
# Redis Configuration (Rate Limiter)
# ================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ================================
# Request Size & Abuse Prevention
# ================================
spring.codec.max-in-memory-size=5MB
server.max-http-request-header-size=16KB

# ================================
# CORS Configuration (Strict & Environment-Based)
# ================================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:63342,http://127.0.0.1:5500}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=Authorization,Content-Type,Accept,X-Request-Id,X-Correlation-Id,X-Requested-With,Origin,Idempotency-Key,idempotency-key
spring.cloud.gateway.globalcors.corsConfigurations.[/**].exposedHeaders=X-Request-Id,X-Correlation-Id,Idempotent-Replayed
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

# ================================
# Default Gateway Filters (Redis Rate Limiting & CORS Deduplication)
# ================================
spring.cloud.gateway.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.default-filters[0].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.replenishRate=50
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.burstCapacity=100
spring.cloud.gateway.default-filters[1].name=DedupeResponseHeader
spring.cloud.gateway.default-filters[1].args.name=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods Vary
spring.cloud.gateway.default-filters[1].args.strategy=RETAIN_FIRST

# ================================
# Gateway Routes Configuration (Discovery-based lb:// routing)
# ================================

# Reservation Service Route
spring.cloud.gateway.routes[0].id=reservation-route
spring.cloud.gateway.routes[0].uri=lb://RESERVATION-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/apir/**,/bookings/**

# Identity Service Route
spring.cloud.gateway.routes[1].id=identity-route
spring.cloud.gateway.routes[1].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**,/admin/**

# AI Service Route
spring.cloud.gateway.routes[2].id=ai-route
spring.cloud.gateway.routes[2].uri=lb://AI-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/ai/**

# Commentaire Service Route
spring.cloud.gateway.routes[3].id=commentaire-route
spring.cloud.gateway.routes[3].uri=lb://COMMENTAIRE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/apic/**

# Travel Service Route (V2 Travel Domain)
spring.cloud.gateway.routes[4].id=travel-route
spring.cloud.gateway.routes[4].uri=lb://TRAVEL-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/travel/**
