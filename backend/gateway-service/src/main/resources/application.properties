# Nom de l'application et port de la gateway
spring.application.name=gateway-service
server.port=8888

# Configuration Eureka
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://discovery-dock:8761/eureka}
eureka.instance.prefer-ip-address=true
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false



# ================================
# Configuration CORS au niveau de la gateway
# ================================
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:63342,null
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# ================================
# Configuration des routes de la gateway
# ================================

# Route pour le service de r�servation
spring.cloud.gateway.routes[0].id=reservation-route
spring.cloud.gateway.routes[0].uri=lb://RESERVATION-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/apir/**

# Route pour le service utilisateur
spring.cloud.gateway.routes[1].id=user-route
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/apiu/**

# Route pour le service AI
spring.cloud.gateway.routes[2].id=ai-route
spring.cloud.gateway.routes[2].uri=lb://AI-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/ai/**

# Route pour le service de commentaires
spring.cloud.gateway.routes[3].id=commentaire-route
spring.cloud.gateway.routes[3].uri=lb://COMMENTAIRE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/apic/**
