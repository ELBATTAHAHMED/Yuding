# Application name and port
spring.application.name=gateway-service
server.port=8888

# ================================
# CORS Configuration
# ================================
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:63342,http://127.0.0.1:5500}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# ================================
# Gateway Routes Configuration
# ================================

# Reservation Service Route
spring.cloud.gateway.routes[0].id=reservation-route
spring.cloud.gateway.routes[0].uri=${RESERVATION_SERVICE_URL:http://localhost:8090}
spring.cloud.gateway.routes[0].predicates[0]=Path=/apir/**

# User Service Route
spring.cloud.gateway.routes[1].id=user-route
spring.cloud.gateway.routes[1].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/apiu/**

# AI Service Route
spring.cloud.gateway.routes[2].id=ai-route
spring.cloud.gateway.routes[2].uri=${AI_SERVICE_URL:http://localhost:7777}
spring.cloud.gateway.routes[2].predicates[0]=Path=/ai/**

# Commentaire Service Route
spring.cloud.gateway.routes[3].id=commentaire-route
spring.cloud.gateway.routes[3].uri=${COMMENTAIRE_SERVICE_URL:http://localhost:8072}
spring.cloud.gateway.routes[3].predicates[0]=Path=/apic/**
