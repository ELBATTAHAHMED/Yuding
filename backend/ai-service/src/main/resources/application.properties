spring.application.name=ai-service
server.address=0.0.0.0
server.port=7777

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Spring Cloud Config Client
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9091}
spring.cloud.config.enabled=true

# OpenAI & PgVector Configuration
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.api-key=${OPENAI_API_KEY:your-openai-api-key}
spring.ai.vectorstore.pgvector.initialize-schema=false

# Database Configuration (PostgreSQL 16 / PgVector - schema: ai)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yuding}?currentSchema=ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.ai.vectorstore.pgvector.schema-name=ai
spring.sql.init.mode=never

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.diskspace.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true

# Logging
logging.level.org.springframework.boot=INFO
