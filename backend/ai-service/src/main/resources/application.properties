spring.application.name=ai-service
server.address=0.0.0.0
server.port=7777

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Spring Cloud Config Client
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9091}
spring.cloud.config.enabled=true

# ====================================================================
# Yuding V2 - AI Provider Configuration
# ====================================================================
yuding.ai.primary-provider=${AI_PRIMARY_PROVIDER:gemini}
yuding.ai.primary-model=${AI_PRIMARY_MODEL:gemini-3.6-flash}

yuding.ai.fallback-enabled=${AI_FALLBACK_ENABLED:true}
yuding.ai.fallback-provider=${AI_FALLBACK_PROVIDER:groq}
yuding.ai.fallback-model=${AI_FALLBACK_MODEL:qwen/qwen3.8-27b}

yuding.ai.gemini.api-key=${GEMINI_API_KEY:}
yuding.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

yuding.ai.groq.api-key=${GROQ_API_KEY:}
yuding.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

yuding.ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:60}
yuding.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:2048}

# Database Configuration (PostgreSQL 16 / PgVector - schema: ai)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yuding}?currentSchema=ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# JPA & Hibernate (Flyway is sole DDL authority, schema: ai)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=ai
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.diskspace.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true

# Logging
logging.level.org.springframework.boot=INFO
logging.level.com.ahmed.aiservice=INFO

# Security: Request Size Limits & Abuse Prevention
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
server.max-http-request-header-size=16KB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:63342,http://127.0.0.1:5500}

# ====================================================================
# Yuding V2 - AI Tools & Downstream Services Configuration
# ====================================================================
yuding.services.travel-url=${TRAVEL_SERVICE_URL:http://localhost:8082}
yuding.services.reservation-url=${RESERVATION_SERVICE_URL:http://localhost:8090}
yuding.ai.tool-timeout-seconds=${AI_TOOL_TIMEOUT_SECONDS:35}
yuding.ai.max-tool-rounds=${AI_MAX_TOOL_ROUNDS:3}
yuding.ai.max-tool-calls-per-request=${AI_MAX_TOOL_CALLS_PER_REQUEST:6}
yuding.ai.max-tool-results=${AI_MAX_TOOL_RESULTS:5}

# ====================================================================
# Yuding V2 - RAG Knowledge & pgvector Configuration
# ====================================================================
yuding.ai.rag.enabled=${AI_RAG_ENABLED:true}
yuding.ai.rag.embedding-provider=${AI_EMBEDDING_PROVIDER:gemini}
yuding.ai.rag.embedding-model=${AI_EMBEDDING_MODEL:gemini-embedding-001}
yuding.ai.rag.embedding-dimension=${AI_EMBEDDING_DIMENSION:768}
yuding.ai.rag.similarity-threshold=${AI_RAG_SIMILARITY_THRESHOLD:0.35}
yuding.ai.rag.top-k=${AI_RAG_TOP_K:4}
yuding.ai.rag.max-context-tokens=${AI_RAG_MAX_CONTEXT_TOKENS:600}
yuding.ai.rag.auto-ingest-on-startup=${AI_RAG_AUTO_INGEST:true}
