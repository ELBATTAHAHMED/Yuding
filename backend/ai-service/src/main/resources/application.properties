spring.application.name=ai-service
server.address=0.0.0.0
server.port=7777

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Spring Cloud Config Client
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9091}
spring.cloud.config.enabled=true

# OpenAI & PgVector Configuration
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.api-key=${OPENAI_API_KEY:your-openai-api-key}
spring.ai.vectorstore.pgvector.initialize-schema=true

# Database Configuration (PostgreSQL / PgVector)
spring.datasource.url=${PGVECTOR_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${PGVECTOR_USER:myuser}
spring.datasource.password=${PGVECTOR_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.diskspace.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true

# Logging
logging.level.org.springframework.boot=INFO
