spring.application.name=travel-service
server.port=8082

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Spring Cloud Config Client
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9091}
spring.cloud.config.enabled=true

# Database Configuration (PostgreSQL 16 - schema: travel)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yuding}?currentSchema=travel}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=travel
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Logging
logging.level.org.springframework.boot=INFO
logging.level.com.ahmed.travelservice=INFO

# Security: Request Size Limits & Abuse Prevention
server.max-http-request-header-size=16KB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:63342,http://127.0.0.1:5500}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Travel Provider Configuration (Phase 21 Abstraction & Phase 22 Scrappa Flights)
travel.providers.flights=${TRAVEL_FLIGHTS_PROVIDER:none}
travel.providers.hotels=${TRAVEL_HOTELS_PROVIDER:none}
travel.providers.activities=${TRAVEL_ACTIVITIES_PROVIDER:none}
travel.providers.transfers=${TRAVEL_TRANSFERS_PROVIDER:none}
travel.providers.default-provider=none

# Scrappa Provider Configuration (Phase 22)
travel.scrappa.api-key=${SCRAPPA_API_KEY:}
travel.scrappa.base-url=${SCRAPPA_BASE_URL:https://scrappa.co/api}
travel.scrappa.connect-timeout-ms=5000
travel.scrappa.read-timeout-ms=15000

