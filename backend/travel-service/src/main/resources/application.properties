spring.application.name=travel-service
server.port=8082

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Spring Cloud Config Client
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9091}
spring.cloud.config.enabled=true

# Database Configuration (PostgreSQL 16 - schema: travel)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yuding}?currentSchema=travel}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=travel
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Logging
logging.level.org.springframework.boot=INFO
logging.level.com.ahmed.travelservice=INFO

# Security: Request Size Limits & Abuse Prevention
server.max-http-request-header-size=16KB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:63342,http://127.0.0.1:5500}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Travel Provider Configuration (Phase 21 Abstraction & Phase 22 Scrappa Flights)
travel.providers.flights=${TRAVEL_FLIGHTS_PROVIDER:none}
travel.providers.hotels=${TRAVEL_HOTELS_PROVIDER:none}
travel.providers.activities=${TRAVEL_ACTIVITIES_PROVIDER:none}
travel.providers.transfers=${TRAVEL_TRANSFERS_PROVIDER:none}
travel.providers.trains=${TRAVEL_TRAINS_PROVIDER:oncf_gtfs}
travel.providers.default-provider=none

# Scrappa Provider Configuration (Phase 22)
travel.scrappa.api-key=${SCRAPPA_API_KEY:}
travel.scrappa.base-url=${SCRAPPA_BASE_URL:https://scrappa.co/api}
travel.scrappa.connect-timeout-ms=10000
travel.scrappa.read-timeout-ms=30000

# Nuitee Provider Configuration (Phase 23)
travel.nuitee.api-key=${NUITEE_API_KEY:}
travel.nuitee.base-url=${NUITEE_BASE_URL:https://api.liteapi.travel/v3.0}
travel.nuitee.connect-timeout-ms=10000
travel.nuitee.read-timeout-ms=20000

# HBX Activities Configuration (Phase 24)
travel.hbx.activities.api-key=${HBX_ACTIVITIES_API_KEY:}
travel.hbx.activities.secret=${HBX_ACTIVITIES_SECRET:}
travel.hbx.activities.base-url=${HBX_ACTIVITIES_BASE_URL:https://api.test.hotelbeds.com/activity-api/3.0}
travel.hbx.activities.connect-timeout-ms=10000
travel.hbx.activities.read-timeout-ms=20000

# HBX Transfers Configuration (Phase 25)
travel.hbx.transfers.api-key=${HBX_TRANSFERS_API_KEY:}
travel.hbx.transfers.secret=${HBX_TRANSFERS_SECRET:}
travel.hbx.transfers.base-url=${HBX_TRANSFERS_BASE_URL:https://api.test.hotelbeds.com/transfer-api/1.0}
travel.hbx.transfers.connect-timeout-ms=10000
travel.hbx.transfers.read-timeout-ms=20000

# ONCF GTFS Trains Configuration (Local Verified Schedules)
travel.oncf-gtfs.data-path=${ONCF_GTFS_DATA_PATH:data/oncf-gtfs}
travel.oncf-gtfs.enabled=${ONCF_GTFS_ENABLED:true}

# Transitland Trains Configuration (Optional / Metadata / Fallback)
travel.transitland.api-key=${TRANSITLAND_API_KEY:}
travel.transitland.base-url=${TRANSITLAND_BASE_URL:https://transit.land/api/v2/rest}
travel.transitland.connect-timeout-ms=10000
travel.transitland.read-timeout-ms=20000
travel.transitland.oncf-operator-id=${TRANSITLAND_ONCF_OPERATOR_ID:o-oncf~morocco}
travel.transitland.oncf-feed-id=${TRANSITLAND_ONCF_FEED_ID:f-oncf~morocco~rail}

# Transitous Global Trains Configuration (MOTIS v2 Public API - No API key required)
travel.transitous.base-url=${TRANSITOUS_BASE_URL:https://api.transitous.org/api}
travel.transitous.user-agent=${TRANSITOUS_USER_AGENT:Yuding/2.0 (https://ahmedelbattah.vercel.app)}
travel.transitous.connect-timeout-ms=10000
travel.transitous.read-timeout-ms=20000

# Global Trains Provider
travel.providers.global-trains=${TRAVEL_GLOBAL_TRAINS_PROVIDER:transitous}

# Geo & Places Provider Configuration (Phase 26 - Geoapify)
travel.providers.geo=${TRAVEL_GEO_PROVIDER:none}
travel.providers.weather=${TRAVEL_WEATHER_PROVIDER:open-meteo}
travel.geoapify.api-key=${GEOAPIFY_API_KEY:}
travel.geoapify.base-url=${GEOAPIFY_BASE_URL:https://api.geoapify.com}
travel.geoapify.maps-base-url=${GEOAPIFY_MAPS_BASE_URL:https://maps.geoapify.com}
travel.geoapify.default-language=${GEOAPIFY_DEFAULT_LANGUAGE:en}
travel.geoapify.autocomplete-limit=${GEOAPIFY_AUTOCOMPLETE_LIMIT:8}
travel.geoapify.places-limit=${GEOAPIFY_PLACES_LIMIT:20}
travel.geoapify.connect-timeout-ms=10000
travel.geoapify.read-timeout-ms=20000

# Live Weather Provider Configuration (Phase 27 - Open-Meteo, no API key required)
travel.open-meteo.base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
travel.open-meteo.forecast-days=${OPEN_METEO_FORECAST_DAYS:7}
travel.open-meteo.timezone=${OPEN_METEO_TIMEZONE:auto}
travel.open-meteo.connect-timeout-ms=10000
travel.open-meteo.read-timeout-ms=20000
