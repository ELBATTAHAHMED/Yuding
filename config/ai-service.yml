# ====================================================================
# Yuding V2 - AI Service Base Configuration (ai-service.yml)
# Schema: ai (pgvector isolation)
# ====================================================================

server:
  address: 0.0.0.0
  port: 7777
  max-http-request-header-size: 16KB

yuding:
  ai:
    primary-provider: ${AI_PRIMARY_PROVIDER:gemini}
    primary-model: ${AI_PRIMARY_MODEL:gemini-3.8-flash}
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    fallback-provider: ${AI_FALLBACK_PROVIDER:groq}
    fallback-model: ${AI_FALLBACK_MODEL:openai/gpt-oss-120b}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:30}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}

spring:
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
