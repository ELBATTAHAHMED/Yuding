# ====================================================================
# Yuding V2 - Gateway Service Production Profile (gateway-service-prod.yml)
# ====================================================================

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: Authorization,Content-Type,X-Request-Id,X-Correlation-Id,X-Requested-With,Accept,Origin
            allowCredentials: true
            maxAge: 3600
