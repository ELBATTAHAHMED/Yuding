# ====================================================================
# Yuding V2 - Gateway Service Production Profile (gateway-service-prod.yml)
# Strict CORS allowlist: MUST be specified via CORS_ALLOWED_ORIGINS.
# Zero fallback to localhost, 127.0.0.1, or wildcard '*'.
# ====================================================================

spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS}
            allowedMethods: GET,POST,PUT,DELETE,PATCH,OPTIONS
            allowedHeaders: Authorization,Content-Type,X-Request-Id,X-Correlation-Id,X-Requested-With,Accept,Origin,Idempotency-Key,idempotency-key
            exposedHeaders: X-Request-Id,X-Correlation-Id,Idempotent-Replayed
            allowCredentials: true
            maxAge: 3600
