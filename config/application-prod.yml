# ====================================================================
# Yuding V2 - Shared Production Profile (application-prod.yml)
# Active when SPRING_PROFILES_ACTIVE=prod
# Strict security: fail-fast on missing secrets; no insecure fallbacks
# ====================================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL}
    prefer-ip-address: true

# Production CORS: strict domain whitelist from environment variable
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Cookie security: HTTPS strictly enforced
cookie:
  secure: true

logging:
  level:
    root: WARN
    org.springframework.security: WARN
    com.ahmed: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
