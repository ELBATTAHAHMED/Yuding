# ====================================================================
# Yuding V2 - Identity Service Production Profile (identity-service-prod.yml)
# ====================================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?currentSchema=identity}

jwt:
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:certs/public.pem}
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

cookie:
  secure: true
