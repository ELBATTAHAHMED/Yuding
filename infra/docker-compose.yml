services:
  # ====================================================================
  # Primary PostgreSQL 16 + pgvector Database
  # Single cluster hosting the 'yuding' database with 8 logical schemas
  # ====================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yuding-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-yuding}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-yuding}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ====================================================================
  # Redis 7 Cache & Rate Limiter
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: yuding-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
