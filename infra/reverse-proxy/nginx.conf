# ====================================================================
# Yuding V2 - Edge Reverse Proxy Configuration (Nginx)
# Phase 19 Production Routing Contract
#
# Routing Architecture:
# - Browser -> https://<DOMAIN>/api/* -> Reverse Proxy -> Gateway (port 8888, '/api' stripped)
# - Browser -> https://<DOMAIN>/*     -> Reverse Proxy -> Next.js Frontend (port 3000)
#
# Rules:
# - Strips public '/api' prefix before forwarding to Gateway
# - Supports same-origin cookie transmission (HttpOnly refresh token)
# - Supports direct browser refresh for Next.js App Router routes
# - Zero downstream microservices exposed to the edge
# ====================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Edge logging format with correlation ID tracking
    log_format yuding_edge '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" correlation_id="$http_x_correlation_id"';

    access_log /var/log/nginx/access.log yuding_edge;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream: API Gateway (Internal microservices perimeter)
    upstream gateway_upstream {
        server gateway-service:8888;
        keepalive 32;
    }

    # Upstream: Next.js Frontend Web Client
    upstream frontend_upstream {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Perimeter Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # ------------------------------------------------------------
        # 1. API Traffic (/api/*) -> Gateway (strips /api)
        # Examples:
        #   /api/auth/login            -> /auth/login
        #   /api/apir/reservations/me  -> /apir/reservations/me
        #   /api/admin/users           -> /admin/users
        #   /api/apic/commentaires     -> /apic/commentaires
        #   /api/ai/chat               -> /ai/chat
        # ------------------------------------------------------------
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;

            # Identity & Client IP propagation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api;

            # Correlation tracking header
            proxy_set_header X-Correlation-Id $http_x_correlation_id;

            # HttpOnly cookie transmission preservation
            proxy_pass_header Set-Cookie;

            # Buffer & Timeout settings
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ------------------------------------------------------------
        # 2. Frontend Traffic (All Other Routes) -> Next.js App Router
        # Preserves direct browser refresh on client routes:
        #   /, /login, /register, /hotels, /flights, /activities,
        #   /transfers, /booking/*, /account/*, /admin/*
        # ------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            # WebSockets / Next.js Fast Refresh & chunk loading
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors off;
        }
    }
}
